<form id="quote-form" class="quote-form">
  <label>Name<input type="text" name="name" required></label>
  <label>Phone<input type="tel" name="phone" required></label>
  <label>Email<input type="email" name="email" required></label>
  <label>Address<input type="text" name="address"></label>
  <label>City<input type="text" name="city"></label>
  <label>State<input type="text" name="state"></label>
  <label>ZIP<input type="text" name="zip"></label>
  <label>Service Needed
    <select name="service">
      <option>Roof Replacement</option>
      <option>Roof Repair</option>
      <option>Storm / Hurricane Damage</option>
      <option>Commercial Roofing</option>
      <option>Inspection / Estimate</option>
      <option>Other</option>
    </select>
  </label>
  <label>Message<textarea name="message" rows="4"></textarea></label>
  <button type="submit" class="btn btn-large">Request Free Quote</button>
  <p id="form-status" style="margin-top:1rem;font-weight:600"></p>
</form>
