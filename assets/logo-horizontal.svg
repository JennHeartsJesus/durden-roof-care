<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <style>
      .roof-line{fill:none;stroke:#1a3a8c;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
      .company-d{font-family:'Times New Roman',Georgia,serif;font-weight:700;font-size:72px;fill:#b40000}
      .company-rest{font-family:'Times New Roman',Georgia,serif;font-weight:700;font-size:52px;fill:#b40000}
      .tagline{font-family:'Arial',Helvetica,sans-serif;font-weight:400;font-size:22px;letter-spacing:4px}
      .tag-com{fill:#b40000}
      .tag-sep{fill:#666}
      .tag-ind{fill:#1a3a8c}
      .tag-res{fill:#666}
    </style>
  </defs>
  <!-- Three angled roof lines -->
  <line class="roof-line" x1="30" y1="95" x2="155" y2="10"/>
  <line class="roof-line" x1="155" y1="10" x2="280" y2="95"/>
  <line class="roof-line" x1="45" y1="95" x2="165" y2="18"/>
  <line class="roof-line" x1="165" y1="18" x2="285" y2="95"/>
  <line class="roof-line" x1="60" y1="95" x2="175" y2="26"/>
  <line class="roof-line" x1="175" y1="26" x2="290" y2="95"/>
  <!-- Company name -->
  <text x="40" y="130"><tspan class="company-d">D</tspan><tspan class="company-rest" dy="0">URDEN </tspan><tspan class="company-d">R</tspan><tspan class="company-rest">OOF </tspan><tspan class="company-d">C</tspan><tspan class="company-rest">ARE</tspan></text>
  <!-- Blue horizontal line -->
  <line x1="30" y1="142" x2="490" y2="142" stroke="#1a3a8c" stroke-width="2"/>
  <!-- Tagline -->
  <text x="260" y="172" text-anchor="middle">
    <tspan class="tagline tag-com">Commercial</tspan>
    <tspan class="tagline tag-sep">  |  </tspan>
    <tspan class="tagline tag-ind">Industrial</tspan>
    <tspan class="tagline tag-sep">  |  </tspan>
    <tspan class="tagline tag-res">Residential</tspan>
  </text>
</svg>
