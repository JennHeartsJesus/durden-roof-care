<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <defs>
    <style>
      .logo-name { font-family: 'Georgia', 'Playfair Display', serif; font-weight: 700; fill: #1a3a5c; }
      .logo-tagline { font-family: 'Arial', 'Inter', sans-serif; font-weight: 700; fill: #c8102e; }
    </style>
  </defs>
  <!-- Roof icon -->
  <polygon points="10,45 40,15 70,45" fill="none" stroke="#1a3a5c" stroke-width="4" stroke-linejoin="round"/>
  <line x1="25" y1="45" x2="25" y2="58" stroke="#1a3a5c" stroke-width="3"/>
  <line x1="55" y1="45" x2="55" y2="58" stroke="#1a3a5c" stroke-width="3"/>
  <line x1="25" y1="58" x2="55" y2="58" stroke="#1a3a5c" stroke-width="3"/>
  <rect x="35" y="48" width="10" height="10" fill="#c8102e" rx="1"/>
  <!-- Company name -->
  <text x="80" y="42" class="logo-name" font-size="28">DURDEN ROOF CARE</text>
  <!-- Tagline -->
  <text x="80" y="62" class="logo-tagline" font-size="14">We Care!</text>
</svg>
